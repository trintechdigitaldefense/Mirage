[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage"
version = "2.2.0"
description = "Mirage — Active Deception Platform by TrinTech Digital Defense (v2.2)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TrinTech Digital Defense", email = "trintechdigitaldefense@gmail.com"}]
dependencies = [
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "paramiko>=3.0.0",
]

[project.scripts]
mirage = "mirage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mirage*"]
