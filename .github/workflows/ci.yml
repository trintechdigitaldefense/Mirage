name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest
      - name: Compile Python sources
        run: |
          find mirage -name "*.py" | while read f; do
            python -m py_compile "$f" || exit 1
          done
      - name: Validate installer shell syntax
        run: bash -n start.sh
      - name: Require tests directory
        run: |
          test -d tests || { echo "tests/ directory is required"; exit 1; }
          test -n "$(find tests -name 'test_*.py' | head -1)" || { echo "No test_*.py files"; exit 1; }
      - name: CLI smoke test
        run: |
          python -c "import mirage; from mirage.redaction import redact_details; from mirage import guardrails; print(mirage.__version__)"
          python -m mirage --help
      - name: Run pytest
        run: pytest -q tests/
